<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplikasi sederhana untuk mencari profil GitHub berdasarkan username.">
    <title>PemWeb</title>
    <link rel="stylesheet" href="tugas5.css">
</head>
<body>

    <main>
        <div class="kartu-utama">

            <!-- Blok kode logo GitHub lingkaran dan menumpuk di tepi kartu bagian atas-->
            <div class="logo" aria-hidden="true">
                <svg viewBox="0 0 16 16" width="56" height="56" fill="currentColor">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                </svg>
            </div>

            <h1 class="sr-only">Mencari Profil GitHub yang diinginkan</h1>

            <form id="form-cari">
                <label for="username" class="sr-only">Username GitHub</label>

                <!-- Blok kode search bar/kolom pencarian sebelah kiri sama tombol kaca pembesar di sebelah kanannya -->
                <div class="pencarian">
                    <input type="text" id="username" name="username"
                           placeholder="Masukkan username GitHub"
                           required autocomplete="off">

                    <button type="submit" id="tombol-cari" aria-label="Cari">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
                             stroke="currentColor" stroke-width="2.4"
                             stroke-linecap="round" aria-hidden="true">
                            <circle cx="10.5" cy="10.5" r="6.5"/>
                            <line x1="15.5" y1="15.5" x2="21" y2="21"/>
                        </svg>
                    </button>
                </div>
            </form>

            <!-- Blok Kode tiga kondisi: loading, muculnya pesan error jika gagal, dan pesan berhasil yang ditandakan dengan munculnya profil -->
            <div id="hasil" aria-live="polite">
                <p id="loading" hidden>Sabar ya...</p>

                <p id="pesan" hidden></p>

                <article id="profil" hidden>
                    <img id="avatar" alt="Avatar pengguna" width="120" height="120"
                         src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
                    <h2 id="nama"></h2>
                    <p id="login"></p>
                    <p id="bio"></p>
                    <p>Repositori publik: <strong id="repo"></strong></p>
                    <a id="link" href="https://github.com" target="_blank" rel="noopener">Lihat profil di GitHub</a>
                </article>
            </div>
        </div>
    </main>

    <footer>
        <p>
            Data diambil dari
            <a href="https://docs.github.com/rest" target="_blank" rel="noopener">GitHub REST API</a>.
        </p>
    </footer>

    <script src="tugas5.js"></script>
</body>
</html>
